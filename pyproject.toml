[project]
name = "riesgo-salud"
version = "1.0.0"
description = "Riesgo de acceso a la salud por municipio en Colombia: dependencia de EPS intervenidas y oferta de IPS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "requests",
    "pyyaml",
    "scikit-learn",
    "matplotlib",
    "mlflow>=3",
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "jupyter",
    "plotly",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riesgo_salud"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# El largo de línea lo resuelve `ruff format`; solo quedan textos largos, que se dejan así
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# En los notebooks se prioriza la lectura de cada celda sobre el largo de línea
"*.ipynb" = ["E501"]
